
# --- BCF Configuration ---
bcf.schema.version=3.0
foundation.version=1.1

# --- Spring Configuration ---
spring.server.port=8080
spring.application.name=BCFserver
spring.profiles.active=prod
spring.config.import=optional:file:.env[.properties]

# --- OAuth2 Resource Server (Validates Bearer Tokens from BCF Clients) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_SERVER_URL:http://localhost:8180}/realms/${AUTH_REALM}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_SERVER_INTERNAL_URL:http://localhost:8180}/realms/${AUTH_REALM}/protocol/openid-connect/certs


# --- OAuth2 Client (Handles Browser Login Redirects) ---
spring.security.oauth2.client.registration.keycloak.client-id=${AUTH_CLIENT_ID}
spring.security.oauth2.client.registration.keycloak.client-secret=${AUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.redirect-uri=${APP_EXTERNAL_URL:http://localhost:8080}/login/oauth2/code/keycloak
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email,groups
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code

spring.security.oauth2.client.provider.keycloak.authorization-uri=${AUTH_SERVER_URL:http://localhost:8180}/realms/${AUTH_REALM}/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=${AUTH_SERVER_INTERNAL_URL:http://localhost:8180}/realms/${AUTH_REALM}/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.user-info-uri=${AUTH_SERVER_INTERNAL_URL:http://localhost:8180}/realms/${AUTH_REALM}/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${AUTH_SERVER_INTERNAL_URL:http://localhost:8180}/realms/${AUTH_REALM}/protocol/openid-connect/certs


# --- Auth ---
auth.provider=${AUTH_PROVIDER:keycloak}



