services:
  postgres:
    image: postgres:17
    container_name: bcf-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  bcf-app:
    image: zaqif/bcf-server:${BCF_IMAGE_VERSION}
    build: .
    pull_policy: build
    container_name: bcf-server
    ports:
      - "8181:8080"
    # All AUTH_* and spring.* settings come from .env
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional local identity provider. Start with: docker-compose --profile keycloak up -d
  keycloak:
    profiles: ["keycloak"]
    image: quay.io/keycloak/keycloak:26.5
    container_name: bcf-keycloak
    command: start-dev
    environment:
      KC_HTTP_PORT: 8180
      KC_HOSTNAME: ${AUTH_SERVER_URL:-http://localhost:8180}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${AUTH_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-admin}
    ports:
      - "8180:8180"
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  postgres_data:
  keycloak_data:
