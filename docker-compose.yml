
services:
  bcf-app:
    image: zaqif/bcf-server:${BCF_IMAGE_VERSION}
    build: .
    pull_policy: build
    container_name: bcf-server
    ports:
      - "8181:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - AUTH_PROVIDER=${AUTH_PROVIDER}
      - AUTH_SERVER_URL=${AUTH_SERVER_URL}
      - AUTH_SERVER_INTERNAL_URL=http://keycloak:8180
      - AUTH_REALM=${AUTH_REALM}
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID}
      - AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET}
    volumes:
      - ./bcfdb:/application/data
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: bcf-keycloak
    command: start-dev
    environment:
      KC_HTTP_PORT: 8180
      KC_HOSTNAME: ${AUTH_SERVER_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${AUTH_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
