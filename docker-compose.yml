  postgres:
    image: postgres:17
    container_name: bcf-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  bcf-app:
    image: zaqif/bcf-server:${BCF_IMAGE_VERSION}
    build: .
    pull_policy: build
    container_name: bcf-server
    ports:
      - "8181:8080"
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_ENABLED: ${AUTH_ENABLED}
      AUTH_SERVER_URL: ${AUTH_SERVER_URL}
      AUTH_REALM: ${AUTH_REALM}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET}
      AUTH_ROLES_CLAIM: ${AUTH_ROLES_CLAIM}
    depends_on:
      postgres:
        condition: service_healthy
#     Uncomment when running with Keycloak:
#     keycloak:
#       condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
#  keycloak_data:
