
# --- BCF Configuration ---
bcf.schema.version=3.0
foundation.version=1.1

# --- Spring ---
server.port=8080
spring.application.name=BCFserver
spring.config.import=optional:file:.env[.properties]

# --- Datasource (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bcf}
spring.datasource.username=${DB_USER:bcf}
spring.datasource.password=${DB_PASSWORD:bcf}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:false}

# --- Auth ---
# Auth is disabled by default. To enable OAuth2, set AUTH_ENABLED=true in .env
# and add the spring.security.oauth2.* block (see README, "Running with an OIDC provider").
# AUTH_DISCOVERY_URI overrides the discovery URL (needed in Docker, where the server
# must reach the provider by service name instead of the public AUTH_SERVER_URL).
auth.enabled=${AUTH_ENABLED:false}
auth.discovery-uri=${AUTH_DISCOVERY_URI:${AUTH_SERVER_URL:}/realms/${AUTH_REALM:}/.well-known/openid-configuration}
auth.roles-claim=${AUTH_ROLES_CLAIM:roles}

# --- Import ---
# Upload limits for POST /import (multiple .bcf files per request are allowed)
spring.servlet.multipart.max-file-size=${IMPORT_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${IMPORT_MAX_REQUEST_SIZE:500MB}
