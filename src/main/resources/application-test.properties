
# --- DATASOURCE (H2 In-Memory) ---
spring.datasource.url=jdbc:h2:mem:bcf_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Disable OAuth2 (no Keycloak needed in test mode) ---
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# Dummy values to prevent startup failure
AUTH_SERVER_URL=http://localhost:8180
AUTH_REALM=openfabtwin
AUTH_CLIENT_ID=bcf-server
AUTH_CLIENT_SECRET=dummy-secret