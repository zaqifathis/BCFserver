
# --- BCF Configuration ---
bcf.schema.version=3.0
foundation.version=1.1

# --- Spring Configuration ---
spring.server.port=8080
spring.application.name=BCFserver
spring.profiles.active=test


# --- OAuth2 Keycloak Configuration ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER_URI:http://localhost:8180/realms/bcf-realm}
spring.security.oauth2.client.registration.bcf-server.client-id=${KEYCLOAK_CLIENT_ID}
spring.security.oauth2.client.registration.bcf-server.client-secret=${KEYCLOAK_CLIENT_SECRET}

