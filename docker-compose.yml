
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: bcf-keycloak
    command: start-dev
    environment:
      KC_HTTP_PORT: 8180
      KC_BOOTSTRAP_ADMIN_USERNAME: ${AUTH_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak_data:/opt/keycloak/data