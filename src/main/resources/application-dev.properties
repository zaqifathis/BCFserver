
# --- DATASOURCE ---
spring.datasource.url=jdbc:sqlite:${user.dir}/data/bcf.db
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# change to ddl-auto=update to keep data after restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always

# Recommended: WAL mode for performance + concurrency
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL;

# SQLite does not support multiple statements in one migration file
#spring.flyway.sql-migration-separator=;

